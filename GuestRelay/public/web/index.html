<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The relay's policy for /web/ (owner-approved 2026-11-03), less frame-ancestors, which a meta
         policy cannot set: the relay's header sends it. No inline script anywhere in this build.
         The relays in connect-src come from internal/webrelay/relays.json (vite.web.config.ts). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' wss://guest.herdrup.app wss://guest.herdrup.themartian.app https://accounts.herdrup.app; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HerdrUp</title>
    <!-- The tab icon and link preview. The files are the relay's shared assets (herdrup#851),
         served from the site root, not from this build. -->
    <meta name="description" content="Use your machines and coding agents from your browser." />
    <meta name="theme-color" content="#13162A" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HerdrUp" />
    <meta property="og:title" content="HerdrUp" />
    <meta property="og:description" content="Use your machines and coding agents from your browser." />
    <meta property="og:image" content="https://guest.herdrup.app/static/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HerdrUp" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="/web/assets/index-DmMra7XX.js"></script>
    <link rel="modulepreload" crossorigin href="/web/assets/bootChoice-B8aLjCtr.js">
    <link rel="modulepreload" crossorigin href="/web/assets/faces-DA8Cyfxo.js">
    <link rel="stylesheet" crossorigin href="/web/assets/bootChoice-HkV7Gwak.css">
    <link rel="stylesheet" crossorigin href="/web/assets/faces-Cfkc4gGZ.css">
    <link rel="stylesheet" crossorigin href="/web/assets/index-BpIhztrB.css">
  </head>
  <body>
    <!-- index.html's layout, which both pages share (boot.ts runs one): the owner's shell
         (src/main.ts) uses all of it; the guest page (src/web/main.ts) the detail column, the top
         and tab bars and #welcome. What the guest page doesn't use starts hidden. -->
    <main id="detail" class="detail">
      <canvas id="field" class="field" hidden></canvas>
      <p id="select" class="select" hidden>Select an agent</p>
      <!-- The owner's host home: web/hosts.ts draws the approved machines here. -->
      <section id="connect" class="connect" hidden>
        <form id="connect-form" class="form" hidden></form>
      </section>
    </main>
    <aside class="sidebar" id="sidebar">
      <header class="topbar">
        <div class="bar-row">
          <div class="capsule" id="bar-leading" hidden></div>
          <div class="bar-title" id="bar-title"></div>
          <div class="capsule" id="bar-actions" hidden></div>
        </div>
      </header>
      <div class="roster" id="roster" hidden>
        <label class="search" id="search-field">
          <span class="search-icon" id="search-icon"></span>
          <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
        </label>
        <div id="rows"></div>
      </div>
      <div class="sidebar-foot" id="sidebar-foot"><nav class="tabbar" id="tabbar"></nav></div>
    </aside>
    <section id="welcome" class="web-welcome" hidden></section>
  </body>
</html>
