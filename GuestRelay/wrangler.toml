name = "herdrup-guest"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
# Attached on deploy; both zones must be on the deploying account. guest.herdrup.app is the
# current name. guest.herdrup.themartian.app keeps SERVING (not redirecting): existing
# invites, guests and hosts carry it as their relay URL, and an invite only opens on the
# relay it names.
routes = [
  { pattern = "guest.herdrup.app", custom_domain = true },
  { pattern = "guest.herdrup.themartian.app", custom_domain = true },
]
# Never push request logs anywhere: see [observability] below.
logpush = false

# The /i invite landing page and its fonts. Requests that match a file never reach the
# Worker. /i/<payload> matches no file, so the Worker serves it the /i page through ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"

# An invite link carries its secret in the path of /i/<payload>, so nothing may record
# request URLs. Workers Logs (whose invocation logs hold the URL of every request),
# traces and Logpush (logpush = false above) stay off, whatever the account default. Stated
# rather than omitted: wrangler leaves the remote setting alone when [observability] is missing.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

# One Durable Object per host_id (guest access contract, herdrup#309/#310).
[[durable_objects.bindings]]
name = "HOSTS"
class_name = "HostRelay"

# One Durable Object per short-invite id: the encrypted blob, its host and expiry.
[[durable_objects.bindings]]
name = "INVITES"
class_name = "InviteBlob"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostRelay"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InviteBlob"]

# Both keyed by CF-Connecting-IP and checked before the Durable Object is reached.
# HOST_CONNECT_LIMIT also covers invite PUT and DELETE.
[[ratelimits]]
name = "GUEST_CONNECT_LIMIT"
namespace_id = "3101"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "HOST_CONNECT_LIMIT"
namespace_id = "3102"
simple = { limit = 10, period = 60 }

# The anonymous usage ping (POST /v1/ping) has its own per-IP budget, so pings never spend
# the host or guest connect limits above.
[[ratelimits]]
name = "PING_LIMIT"
namespace_id = "3103"
simple = { limit = 60, period = 60 }

# One data point per accepted ping: indexes [install], blobs [app, version, build],
# doubles [1]. Never the IP, headers, country or user agent.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "herdrup_usage"

# Opt-in crash and hang reports (POST /v1/crash) have their own per-IP budget, apart from
# the ping and connect limits. The app sends at most 5 a day.
[[ratelimits]]
name = "CRASH_LIMIT"
namespace_id = "3104"
simple = { limit = 10, period = 60 }

# One object per accepted crash or hang report, re-serialized from its validated fields:
# never the IP, headers, country or user agent. The bucket's lifecycle rule deletes each
# object 90 days after upload (README "Crash reports"). The admin reads need the
# CRASH_ADMIN_TOKEN secret; without it they are 404.
[[r2_buckets]]
binding = "CRASHES"
bucket_name = "herdrup-crash-reports"
