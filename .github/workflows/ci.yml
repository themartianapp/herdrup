# The Linux checks: HerdrKit and vendored SwiftTerm tests, the symbol-font and design-token
# checks, the CI tooling checks and the guest relay Worker. PR/manual only: no signing
# secrets or release uploads.
#
# THE SIMULATOR UI MATRIX DOES NOT RUN HERE. It runs on macserve, the owner's Mac build
# service: .macserve.json defines its shards (ui_test), and macserve posts one
# `mac-evidence/org-ios-sim-uitest-v1/<shard>` check per shard on a ready PR. It moved off
# GitHub Actions in November 2026: the matrix ran on the billed `xcode-27` larger runner
# and took nearly all of the organization's macOS minutes. docs/DESIGN.md "CI" has the
# shard table and how to run a shard.
name: CI

on:
  # NO paths-ignore: a workflow skipped by a path filter never reports its required
  # checks, so a docs-only PR waited on them forever. Every PR runs this workflow.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHETHER THIS PR NEEDS THE SIMULATOR MATRIX. A PR that changes only docs, or only the
  # MARKETING_VERSION / CURRENT_PROJECT_VERSION values in project.yml, cannot change what
  # the device shards test (#645 was a 4-line version bump). Tools/ci/ci_scope.py reads the
  # diff hunks and says `ui=true` for anything else, including itself and this file, and
  # for a range it cannot resolve. The matrix itself runs on macserve, which does not read
  # this yet; the job records the decision on every PR so the skip stays available to it.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 Tools/ci/ci_scope.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "UI matrix needed: $EVENT always runs it" >&2
          fi

  # THE 369 HerdrKit TESTS, WHICH UNTIL NOW RAN NOWHERE (herdrup#189).
  #
  # ci.yml built the app and ran the XCUITest and never invoked `swift test`, so every
  # test under Tests/HerdrKitTests was written, maintained and executed by nothing —
  # including the wire-protocol tests, which are the ones where silence is expensive: a
  # wrong CodingKey decodes as nil rather than throwing, so the app quietly loses a field
  # instead of failing. A failing test also sat unnoticed on main because of this.
  #
  # It needs no macOS runner. HerdrKit is pure Swift with no UI framework, so it builds
  # and tests on Linux in about 40 seconds — the cheapest job in the repo, on the runner
  # class that is free for public repositories.
  herdrkit:
    name: HerdrKit and SwiftTerm (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # LoginShellCommandTests runs the app's SSH exec commands through every login
      # shell it finds, because sshd hands them to the ACCOUNT's shell and a fish
      # account broke every channel (herdrup#276). The container has only sh, bash
      # and dash; without these the test skips the shells that actually broke.
      - name: Install login shells
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fish zsh tcsh csh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Test vendored SwiftTerm core
        run: swift test --package-path Vendor/SwiftTerm


  # The shipped symbol font is a PRIVATE-USE-ONLY SUBSET of the upstream Nerd Fonts
  # artifact, because no cascade ordering can be right while the font also maps 14
  # non-private-use codepoints — see Tools/subset-symbols-font.py for the two bugs that
  # proved it. A committed binary nobody can re-derive is indistinguishable from a
  # hand-edited one, so this re-runs the subset over the retained upstream input and
  # fails if the bytes differ.
  #
  # ITS OWN JOB, on the plain runner, NOT a step in the Swift job: the `swift:6.1`
  # container carries no python3, so as a step there it exited 127 and turned the Linux
  # job red on this PR. Nothing here needs Swift, and nothing in Swift needs this.
  #
  # The design-token check and the CI scope classifier's tests ride on this job for the
  # same reason: they need python3 and git, not Swift, and this is the cheapest job that
  # has them.
  symbol-font-subset:
    name: Symbol font is the upstream subset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the symbol font is the upstream subset
        run: |
          set -euo pipefail
          python3 -m venv /tmp/fontenv
          # PINNED: this compares sha256 byte-exactly, so an unpinned fontTools would
          # turn a future upstream release into a red X on unrelated PRs.
          /tmp/fontenv/bin/pip install --quiet 'fonttools==4.65.0'
          /tmp/fontenv/bin/python Tools/subset-symbols-font.py \
            Tools/upstream/SymbolsNerdFontMono-Regular.ttf --check

      # App/Generated/DesignTokens.swift is written from design/tokens.json (shared with
      # Herdrup Desktop) by Tools/tokens/generate.py. Regenerate it and fail if the
      # committed copy differs, so the JSON and the Swift the app builds cannot drift.
      - name: Verify the design tokens are generated
        run: |
          set -euo pipefail
          python3 Tools/tokens/generate.py
          if ! git diff --exit-code -- App/Generated \
            || [ -n "$(git status --porcelain --untracked-files=all -- App/Generated)" ]; then
            git status --short -- App/Generated
            echo "::error::App/Generated is stale: edit design/tokens.json, run python3 Tools/tokens/generate.py, commit both."
            exit 1
          fi

      # The simulator shard scripts and their Python helpers, checked in seconds here
      # rather than an hour into a Mac shard run (#649's first head broke an f-string).
      # check.sh also runs Tools/ci/test_ci_scope.py: ci_scope.py decides whether a PR
      # needs the simulator matrix, so a bug in it would skip the device gate silently.
      - name: Check the CI tooling (shard scripts and scope classifier)
        run: Tools/ci/check.sh

  # The guest relay Worker (GuestRelay): its tests in workerd, its typecheck, and the
  # browser guest it serves from public/web checked byte for byte against the manifest
  # herdrup-desktop's build wrote (npm test runs scripts/web-bundle.mjs first).
  guest-relay:
    name: Guest relay (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GuestRelay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck
