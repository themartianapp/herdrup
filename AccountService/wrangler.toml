name = "herdrup-accounts"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# One origin only. accounts.herdrup.app is attached on deploy; the herdrup.app zone must be on
# the deploying account. No workers.dev URL: the apps (and later the web guest's cookie) know
# one origin.
workers_dev = false
routes = [
  { pattern = "accounts.herdrup.app", custom_domain = true },
]
# Never push request logs anywhere: see [observability] below.
logpush = false

# ID tokens, refresh tokens and nonces travel in request bodies, and later the web sign-in's
# code and state in URLs, so nothing may record requests. Workers Logs (whose invocation logs
# hold the URL of every request), traces and Logpush (logpush = false above) stay off,
# whatever the account default. Stated rather than omitted: wrangler leaves the remote
# setting alone when [observability] is missing.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

# Accounts, their sign-in identities, sessions, devices and sync items (migrations/).
[[d1_databases]]
binding = "DB"
database_name = "herdrup-accounts"
# Created by the owner on 2026-11-19 in the EU jurisdiction (a database can't change
# jurisdiction afterwards). The id is not a secret. Apply the migrations before the first
# deploy:
#   npx wrangler d1 migrations apply herdrup-accounts --remote
database_id = "b045413f-9d97-4568-a2aa-3fb7ab87ba28"
migrations_dir = "migrations"

# Keyed by CF-Connecting-IP and checked before the body is read: the nonce, both sign-ins
# and refresh share it.
[[ratelimits]]
name = "AUTH_IP_LIMIT"
namespace_id = "6981"
simple = { limit = 20, period = 60 }

# Keyed by account id, after the access token is checked: every authenticated call.
[[ratelimits]]
name = "ACCOUNT_LIMIT"
namespace_id = "6982"
simple = { limit = 120, period = 60 }

# Keyed by account id, on top of ACCOUNT_LIMIT: statement batches (a live share asks about
# every 8 minutes) ...
[[ratelimits]]
name = "STATEMENT_LIMIT"
namespace_id = "6983"
simple = { limit = 30, period = 60 }

# ... device challenges and enrolments ...
[[ratelimits]]
name = "ENROL_LIMIT"
namespace_id = "6985"
simple = { limit = 10, period = 60 }

# ... and sync pushes (POST /v1/sync). Pulls count against ACCOUNT_LIMIT alone.
[[ratelimits]]
name = "SYNC_WRITE_LIMIT"
namespace_id = "6984"
simple = { limit = 30, period = 60 }

# Hourly cleanup (src/cleanup.ts): spent nonces and refresh tokens, enrolment challenges and
# sessions past their expiry, sync tombstones older than 90 days, and accounts not seen for 24
# months.
[triggers]
crons = ["17 * * * *"]

# Public identifiers only. The ID tokens' audiences: Sign in with Apple's App ID (native) and
# Services ID (web, used from a later step); the Google iOS client (bundle com.jerryfane.herdr,
# team FXQ5Z9HHY6) and web client (redirect .../v1/auth/web/google/callback), both in the
# Google Cloud project themartianapp. An empty Google id leaves Google sign-in answering
# 500 not_configured.
[vars]
APPLE_APP_CLIENT_ID = "com.jerryfane.herdr"
APPLE_WEB_CLIENT_ID = "com.jerryfane.herdr.signin"
GOOGLE_IOS_CLIENT_ID = "552913387875-ujv6unveo5qtmmbnapogekc5jl8h6olk.apps.googleusercontent.com"
GOOGLE_WEB_CLIENT_ID = "552913387875-0te8j0cm9tmt5ifai9m8nlc1igdhi844.apps.googleusercontent.com"
# Statement signing (src/signing.ts): two key slots, so a key rotates without leaving
# Cloudflare. A slot is published in /.well-known/jwks.json once it has both its key (secret
# STATEMENT_KEY_A / STATEMENT_KEY_B) and its kid; STATEMENT_ACTIVE names the slot that signs.
# STATEMENT_REVOKED_KIDS lists kids never used or published again (after a compromise).
# README "Rotate the statement key" has the steps.
STATEMENT_ACTIVE = "A"
STATEMENT_KID_A = "2026-11a"
STATEMENT_KID_B = ""
STATEMENT_REVOKED_KIDS = ""
# The web guest (DESIGN.md §2.5, §2.6): the only origin CORS allows, with credentials, and
# where the web sign-in flow returns to (/web/?account=1).
WEB_ORIGIN = "https://guest.herdrup.app"

# Secrets (wrangler secret put), never in this file:
#   ACCOUNT_HMAC_KEY   32 random bytes, standard base64. Keys the sign-in nonces and the stored
#                      hash of each provider's user id. Losing it orphans every account, so the
#                      owner keeps a copy in the keyring (README "Deploy").
#   GOOGLE_WEB_CLIENT_SECRET  the Google web client's secret; the owner pastes it at the first
#                      deploy. The web sign-in flow's code exchange (src/web.ts) uses it; while
#                      it is unset, the Google web flow answers 503 and Apple's still works.
#   STATEMENT_KEY_A, STATEMENT_KEY_B  Ed25519 private keys that sign statements, PKCS8 DER in
#                      standard base64, generated straight into the Worker (README "Deploy").
#                      No copy is kept: a lost key is rotated, never restored.
